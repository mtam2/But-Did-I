<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>But Did I?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>But Did I?</h1>
      <div class="header-buttons">
        <button id="btn-export" title="Show a copy-pasteable string of your timers and log">export</button>
        <button id="btn-import" title="Paste an exported string to merge it in">import</button>
        <button id="btn-fullscreen" title="Toggle fullscreen">fullscreen</button>
        <button id="btn-dark-mode" title="Toggle dark mode">dark</button>
      </div>
    </div>

    <div class="add-form">
      <label>
        Name
        <input type="text" id="inp-name" placeholder="e.g. Iron" />
      </label>
      <label>
        Category
        <input
          type="text"
          id="inp-category"
          placeholder="e.g. Supplements"
          list="category-list"
        />
        <datalist id="category-list"></datalist>
      </label>
      <label>
        Color
        <input type="color" id="inp-color" value="#e53935" />
      </label>
      <label>
        Alarm after
        <span class="alarm-input">
          <input type="number" min="0" step="any" id="inp-alarm-amount" placeholder="off" />
          <select id="inp-alarm-unit">
            <option value="min">min</option>
            <option value="hr" selected>hr</option>
            <option value="day">day</option>
          </select>
        </span>
      </label>
      <button id="btn-add" title="Add timer" aria-label="Add timer">+</button>
    </div>

    <div id="timers-container"></div>

    <dialog id="data-dialog">
      <h2 id="data-dialog-title">Export</h2>
      <p id="data-dialog-hint" class="dialog-hint"></p>
      <textarea
        id="data-text"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
      ></textarea>
      <div class="dialog-actions">
        <button id="btn-data-close">close</button>
        <button id="btn-data-primary" class="dialog-primary">copy</button>
      </div>
    </dialog>

    <dialog id="backdate-dialog">
      <h2>Reset earlier</h2>
      <p id="backdate-hint" class="dialog-hint"></p>
      <div class="picker">
        <div class="picker-row">
          <button type="button" class="picker-step" data-unit="day" data-dir="-1" aria-label="Previous day">&#8249;</button>
          <span id="picker-day" class="picker-value"></span>
          <button type="button" class="picker-step" data-unit="day" data-dir="1" aria-label="Next day">&#8250;</button>
        </div>
        <div class="picker-row">
          <button type="button" class="picker-step" data-unit="hr" data-dir="-1" aria-label="An hour earlier">&#8249;</button>
          <span id="picker-hour" class="picker-value"></span>
          <button type="button" class="picker-step" data-unit="hr" data-dir="1" aria-label="An hour later">&#8250;</button>
        </div>
        <div class="picker-row">
          <button type="button" class="picker-step" data-unit="min" data-dir="-1" aria-label="Five minutes earlier">&#8249;</button>
          <span id="picker-minute" class="picker-value"></span>
          <button type="button" class="picker-step" data-unit="min" data-dir="1" aria-label="Five minutes later">&#8250;</button>
        </div>
      </div>
      <div class="picker-presets">
        <button type="button" data-ago="900000">15 min ago</button>
        <button type="button" data-ago="3600000">1 hr ago</button>
        <button type="button" data-ago="10800000">3 hr ago</button>
        <button type="button" data-ago="86400000">1 day ago</button>
      </div>
      <p id="picker-preview" class="picker-preview"></p>
      <div class="dialog-actions">
        <button id="btn-backdate-cancel">cancel</button>
        <button id="btn-backdate-save" class="dialog-primary">save</button>
      </div>
    </dialog>

    <div id="log-section">
      <h2>Reset Log <button id="btn-clear-log" title="Clear log">&times;</button></h2>
      <ul id="log-list"></ul>
    </div>

    <footer>
      <a href="https://github.com/maximtam/But-Did-I">GitHub</a>
      <span>But Did I? &copy; 2026 Maxim Tam &middot; GPLv3</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
